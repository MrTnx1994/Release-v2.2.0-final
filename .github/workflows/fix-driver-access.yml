name: Finalize UI and driver access

on:
  push:
    branches:
      - ui-calendar-v2.2.2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-calendar-v2.2.2
          fetch-depth: 0

      - name: Apply only confirmed final fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')

          # Persist the selected tab between browser restarts.
          s = s.replace(
              'const saved = sessionStorage.getItem("app_active_tab");',
              'const saved = localStorage.getItem("app_active_tab");',
              1,
          )
          s = s.replace(
              'sessionStorage.setItem("app_active_tab", tab);',
              'localStorage.setItem("app_active_tab", tab);',
              1,
          )

          # Drivers may use Dashboard and other permitted tabs; only admin-only
          # tabs are redirected for non-admin users.
          old = '''    if (role === "driver" && activeTab !== "drivers") {
      setActiveTab("drivers");
    } else if (role !== "admin" && (activeTab === "logs" || activeTab === "users" || activeTab === "backup")) {
      setActiveTab("dashboard");
    }'''
          new = '''    if (role !== "admin" && (activeTab === "logs" || activeTab === "users" || activeTab === "backup")) {
      setActiveTab("dashboard");
    }'''
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          # Keep the approved soft radial pastel-blue background exactly as the
          # final UI layer; do not alter the application layout.
          css = Path('public/ui-polish.css')
          css.write_text('''/* Final UI polish: same pastel-blue family, stronger in the center and softly fading toward the edges. */
body {
  background: radial-gradient(circle at 50% 46%, #8fc1f5 0%, #9ccaf7 22%, #afd5f8 45%, #c6e1fa 68%, #deeffc 84%, #eef8fe 100%) !important;
}

.dark body {
  background: linear-gradient(115deg, #0f172a 0%, #172554 48%, #064e3b 100%) !important;
}
''', encoding='utf-8')
          PY

      - name: Commit final branch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx public/ui-polish.css
          git rm .github/workflows/fix-driver-access.yml
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: finalize ui-calendar-v2.2.2"
          else
            git commit -m "fix: finalize driver access and persistent UI settings"
          fi
          git push origin HEAD:ui-calendar-v2.2.2
